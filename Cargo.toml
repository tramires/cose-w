[package]
name = "cose-w"
version = "0.1.12"
authors = ["Tiago Ramires"]
license = "MIT"
description = "COSE WebAssembly"
repository = "https://github.com/tramires/cose-w"
readme = "README.md"
keywords = ["cose", "mac", "encryption", "signature", "cbor", "wasm"]
categories = ["cryptography", "encoding"]
edition = "2021"

[profile.release]
opt-level = 'z'
lto = true

[lib]
crate-type=["cdylib"]
name = "cose"


[dev-dependencies]
wasm-bindgen-test = "0.3.0"
serde_json = "1.0.140"
hex = "0.4.3"
regex = "1.11.1"

[dependencies]
js-sys = "0.3.77"
wasm-bindgen = "0.2.130"
hkdf = "0.13.0"
getrandom = {version="0.4.3", features=["wasm_js"]}
hmac = "0.13.0"
sha2 = "0.11.1"
chacha20poly1305 = "0.11.0"
aes-kw ="0.3.1"
aes = "0.9.4"
cbc-mac = "0.2.0"
aes-gcm = "0.11.1"
ccm = "0.6.1"
sha1 = "0.11.0"
pkcs1 = {version="0.7.5", features=["alloc"]}
